# Реалистичный бюджет на задачу, согласованный с правилом "12h на ~120 задач теста".
# НЕ единственный бюджет для тренировки -- используется куррикулумом в tight_budget_fraction
# доле шагов train_gigpo.py, чтобы политика умела работать и в сжатых условиях.
evaluation:
  timeout_seconds: 300
  max_tool_calls: 30
  max_time_minutes: 5
  max_turns: 60
